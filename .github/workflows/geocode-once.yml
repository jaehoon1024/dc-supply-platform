# 일회성: 정밀 주소 → 좌표(OpenStreetMap Nominatim) 조회. 결과는 실행 로그의 RESULT 줄. 확인 후 삭제 예정.
name: geocode-once
on:
  push:
    branches: [main]
    paths: ['tools/geocode-addr.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/geocode.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/geocode-result.json
          git commit -m "chore: 좌표 조회 결과 (geocode-once)"
          git pull --rebase && git push
